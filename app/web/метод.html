<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FieldFactor · метод</title>
<link rel="stylesheet" href="/web/стиль.css">
<link rel="stylesheet" href="/web/сторінка.css">
</head>
<body>

<header class="шапка">
  <div class="шапка-ряд">
    <div>
      <div class="назва"><b>Field</b>Factor</div>
      <div class="гасло">Метод · знімок із майстерні</div>
    </div>
    <div class="шапка-права">
      <a class="назад" href="/відбір">відбір</a>
      <a class="назад" href="/карта">карта внесення</a>
      <a class="назад" href="/продукти">продукти</a>
      <a class="назад" href="/аналізи">аналізи</a>
      <a class="назад" href="/">← до роботи</a>
    </div>
  </div>
</header>

<main class="сторінка метод" id="метод">
  <p class="вступ">Читаю…</p>
</main>

<script>
const тег = (т, к, х) => {
  const в = document.createElement(т);
  if (к) в.className = к;
  if (х !== undefined) в.innerHTML = х;
  return в;
};
const мітка = (з) => `<span class="мітка ${з}">${з}</span>`;
const ч = (з, зн) => (з === null || з === undefined || з === "")
  ? "—" : Number(з).toFixed(зн === undefined ? 2 : зн).replace(".", ",");

function таблиця(шапка, рядки) {
  const т = тег("table");
  const го = тег("thead"), тр = тег("tr");
  шапка.forEach(([п, кл]) => тр.appendChild(тег("th", кл, п)));
  го.appendChild(тр);
  т.appendChild(го);
  const тіло = тег("tbody");
  рядки.forEach(р => {
    const рядок = тег("tr");
    р.forEach((к, i) => рядок.appendChild(тег("td", шапка[i][1] || "", к)));
    тіло.appendChild(рядок);
  });
  т.appendChild(тіло);
  return т;
}

function малювати(д) {
  const к = document.getElementById("метод");
  к.innerHTML = "";
  const дод = (в) => к.appendChild(в);
  const п = д.провенанс;

  дод(тег("h1", null, "Метод норм: що саме лежить у програмі"));
  дод(тег("p", "вступ",
    "Числа скопійовані з майстерні <code>" + п.майстерня + "</code> " +
    "і живуть тут своїм життям. Копія розходиться з оригіналом мовчки — " +
    "тому нижче лежить звірка. Норми звужені до вапнування: усе, що " +
    "стосується калію, магнію й бендів забезпеченості, у знімок не входило."));

  // --- звірка ---
  дод(тег("h2", null, "Звірка з майстернею"));
  const зф = д.звірка_файлів || [];
  const зз = д.звірка_значень || {};
  const змінені = зф.filter(р => р.стан === "ЗМІНЕНО");
  const доступні = зф.filter(р => р.стан !== "недоступне");
  let вирок, клас;
  if (!доступні.length) {
    вирок = "Майстерні на цій машині немає — звірити нема з чим. " +
            "Для машини господарства це норма: знімок самодостатній.";
    клас = "смуга";
  } else if (змінені.length) {
    вирок = "<b>Джерело в майстерні змінилось.</b> Знімок відстав від " +
            "оригіналу — перш ніж рахувати, треба переглянути діф.";
    клас = "смуга тривога";
  } else if ((зз.розбіжності || []).length) {
    вирок = "<b>Файли ті самі, а числа розійшлись.</b> Так не буває без " +
            "правки руками у знімку — дивитись список нижче.";
    клас = "смуга тривога";
  } else {
    вирок = "<b>Знімок збігається з майстернею.</b> Звірено " +
            (зз.звірено || 0) + " чисел, розбіжностей немає.";
    клас = "смуга";
  }
  дод(тег("div", клас, вирок));

  дод(таблиця(
    [["джерело"], ["коміт"], ["знято"], ["стан"], ["що це означає"]],
    зф.map(р => {
      const дж = п.джерела.find(x => x.ключ === р.ключ) || {};
      return [
        "<code>" + р.файл + "</code>",
        р.коміт ? "<code>" + р.коміт + "</code>"
                : '<span class="тиха">поза git</span>',
        '<span class="тиха">' + (дж.дата_коміта || "—") + "</span>",
        мітка(р.стан),
        '<span class="тиха">' + (р.що_це_означає || "") + "</span>",
      ];
    })));

  if ((зз.розбіжності || []).length) {
    // числа показуємо стисло: 71,27880959999999 нічого не додає до «зрушило»
    const як_є = (з) => (typeof з === "number" && !Number.isInteger(з))
      ? ч(з, 4) : String(з);
    дод(таблиця([["що розійшлось"], ["у майстерні", "ч"], ["у знімку", "ч"]],
      зз.розбіжності.map(р => [
        "<code>" + р.імʼя + "</code>", як_є(р.майстерня), як_є(р.продукт)])));
  }

  // --- продукти ---
  дод(тег("h2", null, "Продукти й нейтралізуюча здатність"));
  дод(тег("p", "вступ",
    "CCE не копіюється, а рахується зі складу: " +
    "CaO × " + ч(д.хімія.CaO_CaCO3, 4) + " + MgO × " + ч(д.хімія.MgO_CaCO3, 4) +
    ". Солі кислотності не знімають — їхній магній заходить на комплекс " +
    "за рахунок кальцію, тому CCE у них нуль. Продукти поза обсягом " +
    "у розрахунок вапнування не входять."));
  const пр = д.продукти;
  дод(таблиця(
    [["продукт"], ["CaO %", "ч"], ["MgO %", "ч"], ["K₂O %", "ч"],
     ["CCE %", "ч"], ["мін – макс, кг/га", "ч"], ["статус"], ["звідки склад"]],
    Object.keys(пр).map(ключ => {
      const т = пр[ключ];
      const назва = т.у_обсязі ? "<b>" + т.назва + "</b>"
        : т.назва + ' <span class="тиха">· поза обсягом</span>';
      return [
        назва, ч(т.CaO), ч(т.MgO), ч(т.K2O), ч(т.CCE),
        т.мінімум + " – " + т.максимум,
        мітка(т.статус),
        '<span class="тиха">' + т.джерело +
          (т.примітка ? "<br>⚠ " + т.примітка : "") + "</span>",
      ];
    })));

  // --- пороги ---
  дод(тег("h2", null, "Пороги й ворота"));
  const пг = д.пороги, вр = д.ворота;
  const цілі = Object.keys(пг.pH_ціль)
    .filter(х => х !== "замовчування")
    .map(х => х + " " + ч(пг.pH_ціль[х], 1)).join(" · ");
  дод(таблиця([["що"], ["значення", "ч"], ["що це означає"]], [
    ["Глибина шару", ч(д.фізика.глибина_см, 0) + " см",
     "з нашого завдання на відбір, не з протоколу лабораторії"],
    ["Цільовий pH KCl", ч(пг.pH_ціль["замовчування"], 1),
     "за замовчуванням; за культурою: " + цілі],
    ["Шум методу", "± " + ч(пг.pH_без_дії, 1) + " од. pH",
     "ближче до цілі за це — не чіпаємо"],
    ["Довідникове V", ч(пг.V_ціль_довідник, 0) + " %",
     "береться тільки коли своєї буферної кривої поля немає"],
    ["Крива поля", "від " + пг.крива_мін_точок + " точок",
     "менше точок — крива не будується"],
    ["ЄКО замала", "< " + ч(пг.ЄКО_замала, 1) + " мекв/100 г",
     "вапно підніме pH ненадовго: тримати його немає на чому"],
    ["Пісок окремо", "≥ " + ч(пг.пісок_окремо, 0) + " %",
     "піщані точки в криву мінеральних не пускаємо"],
    ["Ca витісняє K", "> " + ч(вр.Ca_душить_K, 0) + " % ЄКО",
     "ворота, не ціль: скасовують вапнування при низькому калії"],
    ["Mg витісняє K", "> " + ч(вр.Mg_душить_K, 0) + " % ЄКО", "те саме"],
    ["K витісняє Mg", "> " + ч(вр.K_душить_Mg, 0) + " % ЄКО", "зворотний бік"],
  ]));

  // --- похибки ---
  дод(тег("h2", null, "Похибки методу і вирок рішення"));
  дод(тег("p", "вступ",
    "Питання не «як зміниться число», а «чи зміниться дія». Відстань від " +
    "виміру до порога міряється у σ методу: до " + ч(д.вирок.випадкове, 0) +
    "σ рішення <b>ВИПАДКОВЕ</b>, до " + ч(д.вирок.на_межі, 0) +
    "σ — <b>НА МЕЖІ</b>, далі — <b>СТІЙКЕ</b>. Похибки міжлабораторні: " +
    "повторний аналіз у тій самій лабораторії їх майже не знімає."));
  const пх = д.похибки;
  дод(таблиця([["показник"], ["1σ краща", "ч"], ["1σ гірша", "ч"],
               ["вид"], ["статус"], ["джерело"]],
    Object.keys(пх).map(х => {
      const е = пх[х];
      const од = е.вид === "відн" ? " %" : " од.";
      const мн = е.вид === "відн" ? 100 : 1;
      return [х, ч(е.lo * мн, е.вид === "відн" ? 1 : 3) + од,
              ч(е.hi * мн, е.вид === "відн" ? 1 : 3) + од,
              е.вид === "відн" ? "відносна" : "абсолютна",
              мітка(е.статус), '<span class="тиха">' + е.джерело + "</span>"];
    })));

  // --- статуси ---
  дод(тег("h2", null, "Статус кожного числа"));
  дод(тег("p", "вступ",
    "Без статусу число не застосовується. <b>ОСПОРЕНО</b> означає, що " +
    "поважне джерело заперечує метод, а ми його все одно застосовуємо — " +
    "таке йде у звіт тільки з прямим застереженням."));
  дод(таблиця([["що"], ["статус"], ["чому саме такий"]],
    Object.keys(д.статуси).map(х => [
      "<code>" + х + "</code>", мітка(д.статуси[х].статус),
      '<span class="тиха">' + д.статуси[х].чому + "</span>"])));

  // --- що не взято ---
  дод(тег("h2", null, "Що в знімок не входило"));
  const сп = тег("ul");
  д.не_взято.forEach(х => сп.appendChild(тег("li", null, х)));
  дод(сп);
  дод(тег("p", "тиха",
    "Знято " + п.знято + " · HEAD майстерні <code>" +
    п.HEAD_майстерні.slice(0, 7) + "</code> · " + п.дозвіл));
}

fetch("/api/метод")
  .then(в => в.json())
  .then(малювати)
  .catch(п => {
    document.getElementById("метод").innerHTML =
      '<div class="смуга тривога">Не вдалось прочитати метод: ' + п + "</div>";
  });
</script>
</body>
</html>
